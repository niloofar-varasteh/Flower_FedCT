<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #111827; }
      .box { font: 16px Arial, sans-serif; fill: #111827; }
      .label { font: 14px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" class="title">Federated Co-Training (FedCT) Workflow</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">Clients share hard labels on a public unlabeled set, not private data or model weights.</text>

  <rect x="55" y="130" width="220" height="74" rx="10" fill="#f7e8ff" stroke="#334155" stroke-width="2"/>
  <text x="165" y="158" text-anchor="middle" class="box-title">Private labeled data</text>
  <text x="165" y="183" text-anchor="middle" class="box">D_i stays local</text>

  <rect x="55" y="245" width="220" height="74" rx="10" fill="#dff3ff" stroke="#334155" stroke-width="2"/>
  <text x="165" y="273" text-anchor="middle" class="box-title">Client model i</text>
  <text x="165" y="298" text-anchor="middle" class="box">local training</text>

  <rect x="55" y="360" width="220" height="74" rx="10" fill="#e8f8ef" stroke="#334155" stroke-width="2"/>
  <text x="165" y="388" text-anchor="middle" class="box-title">Public unlabeled set</text>
  <text x="165" y="413" text-anchor="middle" class="box">U shared by clients</text>

  <rect x="390" y="245" width="250" height="74" rx="10" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
  <text x="515" y="273" text-anchor="middle" class="box-title">Hard-label predictions</text>
  <text x="515" y="298" text-anchor="middle" class="box">on U only</text>

  <rect x="735" y="245" width="230" height="74" rx="10" fill="#fff1cc" stroke="#334155" stroke-width="2"/>
  <text x="850" y="273" text-anchor="middle" class="box-title">Server majority vote</text>
  <text x="850" y="298" text-anchor="middle" class="box">consensus labels</text>

  <rect x="1010" y="245" width="145" height="74" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
  <text x="1082" y="273" text-anchor="middle" class="box-title">Pseudo-labeled</text>
  <text x="1082" y="298" text-anchor="middle" class="box">public data</text>

  <rect x="390" y="390" width="250" height="74" rx="10" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
  <text x="515" y="418" text-anchor="middle" class="box-title">Next cycle</text>
  <text x="515" y="443" text-anchor="middle" class="box">train on D_i + pseudo-U</text>

  <path d="M 275 167 C 330 170, 340 250, 388 270" class="arrow"/>
  <text x="330" y="207" text-anchor="middle" class="label">labels never leave client</text>

  <path d="M 275 397 C 330 390, 340 315, 388 294" class="arrow"/>
  <text x="335" y="370" text-anchor="middle" class="label">same public inputs</text>

  <line x1="640" y1="282" x2="732" y2="282" class="arrow"/>
  <text x="686" y="266" text-anchor="middle" class="label">share hard labels</text>

  <line x1="965" y1="282" x2="1007" y2="282" class="arrow"/>
  <text x="986" y="266" text-anchor="middle" class="label">vote</text>

  <path d="M 1082 319 C 940 450, 710 470, 642 430" class="arrow"/>
  <text x="865" y="442" text-anchor="middle" class="label">broadcast consensus</text>

  <path d="M 390 427 C 290 425, 255 330, 275 293" class="arrow"/>
  <text x="300" y="455" text-anchor="middle" class="label">update local model</text>

  <text x="600" y="500" text-anchor="middle" class="subtitle">One communication cycle = 8 local training rounds followed by prediction sharing and majority voting.</text>
</svg>

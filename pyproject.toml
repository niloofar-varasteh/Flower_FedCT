[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcot"
version = "1.0.0"
description = "Federated Deep Co-Training with Flower"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FedCT Team"}
]

dependencies = [
    "flwr[simulation]>=1.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedcot"]

# ============================================================================
# FLOWER CONFIGURATION
# ============================================================================

[tool.flwr.app]
publisher = "fedcot"

[tool.flwr.app.components]
serverapp = "fedcot.server_app:app"
clientapp = "fedcot.client_app:app"

[tool.flwr.app.config]
# === TRAINING CONFIGURATION ===
num-communication-rounds = 25
num-clients = 5
num-local-rounds = 4
unlabeled-size = 100

# === DATASET CONFIGURATION ===
dataset = "CIFAR10"

# === DATA DISTRIBUTION ===
# Options: "iid", "non-iid-dirichlet", "non-iid-shards"
data-distribution = "iid"

# For non-iid-dirichlet: Lower alpha = more non-IID
# Examples: 0.1 (highly non-IID), 0.5 (moderately non-IID), 1.0 (less non-IID)
alpha = 0.5

# For non-iid-shards: Number of class shards per client
shards-per-client = 2

# === OPTIMIZER CONFIGURATION ===
optimizer = "Adam"
learning-rate = 0.001
private-batch-size = 64
public-batch-size = 32

# === CLIENT STATE PERSISTENCE ===
save-checkpoints = true
checkpoint-dir = "./checkpoints"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.init_args.logging_level = 20
options.backend.init_args.log_to_driver = true

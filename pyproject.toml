[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcot"
version = "1.0.0"
description = "Federated Deep Co-Training with Flower"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FedCT Team"}
]

dependencies = [
    "flwr[simulation]>=1.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedcot"]

# ============================================================================
# FLOWER CONFIGURATION
# ============================================================================

[tool.flwr.app]
publisher = "fedcot"

[tool.flwr.app.components]
serverapp = "fedcot.server_app:app"
clientapp = "fedcot.client_app:app"

[tool.flwr.app.config]
# === TRAINING CONFIGURATION ===
num-communication-rounds = 25     # Number of communication rounds
num-clients = 5                   # Number of clients participating
num-local-rounds = 4              # Number of local rounds before communication
unlabeled-size = 100              # Size of public unlabeled dataset

# === DATASET CONFIGURATION ===
dataset = "CIFAR10"               # Dataset: CIFAR10 or FashionMNIST

# === DATA DISTRIBUTION ===
# Options: "iid", "non-iid-dirichlet", "non-iid-shards"
data-distribution = "iid"

# For non-iid-dirichlet: Lower alpha = more non-IID
# Examples: 0.1 (highly non-IID), 0.5 (moderately non-IID), 1.0 (less non-IID)
alpha = 0.1

# For non-iid-shards: Number of class shards per client
shards-per-client = 2

# === OPTIMIZER CONFIGURATION ===
optimizer = "Adam"                # Optimizer: SGD or Adam
learning-rate = 0.001             # Learning rate
private-batch-size = 64           # Batch size for private data
public-batch-size = 32            # Batch size for public pseudo-labeled data

# === CLIENT STATE PERSISTENCE ===
save-checkpoints = true           # Save client model checkpoints
checkpoint-dir = "./checkpoints"  # Directory to save checkpoints

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.init_args.logging_level = 40
options.backend.init_args.log_to_driver = false

# ============================================================================
# EXAMPLE CONFIGURATIONS FOR DIFFERENT SCENARIOS
# ============================================================================

# === IID CONFIGURATION (Balanced data distribution) ===
[tool.flwr.app.config.iid-example]
data-distribution = "iid"
num-clients = 5
alpha = 1.0  # Not used for IID

# === NON-IID DIRICHLET (Statistical heterogeneity) ===
[tool.flwr.app.config.non-iid-dirichlet-example]
data-distribution = "non-iid-dirichlet"
alpha = 0.1  # 0.1 = highly non-IID, 0.5 = moderately, 1.0 = less non-IID
num-clients = 5

# === NON-IID SHARDS (Class-based heterogeneity) ===
[tool.flwr.app.config.non-iid-shards-example]
data-distribution = "non-iid-shards"
shards-per-client = 2  # Each client gets 2 class shards
num-clients = 5
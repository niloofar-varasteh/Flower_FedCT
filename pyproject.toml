[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcot"
version = "1.0.0"
description = "Federated Deep Co-Training with Flower"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FedCT Team"}
]

dependencies = [
    "flwr[simulation]>=1.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedcot"]

# ============================================================================
# FLOWER CONFIGURATION
# ============================================================================

[tool.flwr.app]
publisher = "fedcot"

[tool.flwr.app.components]
serverapp = "fedcot.server_app:app"
clientapp = "fedcot.client_app:app"

[tool.flwr.app.config]
num-communication-rounds = 2    # Number of communication rounds (MATCH FedAvg)
num-clients = 5                   # Number of clients participating
num-local-rounds =2             # Number of local rounds (MATCH FedAvg: 20×3=60 total epochs)
unlabeled-size = 100             # Size of public unlabeled dataset (shared across all clients)
dataset = "CIFAR10"               # Dataset: CIFAR10 or FashionMNIST
optimizer = "Adam"                # Optimizer: SGD or Adam (Adam default for better performance)
learning-rate = 0.001             # Learning rate (optimized for Adam)
private-batch-size = 64           # Batch size for private data (larger batch for stability)
public-batch-size = 32            # Batch size for public pseudo-labeled data

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5  # Should match num-clients in run-config (modify if using more clients)
options.backend.init_args.logging_level = 40  # Suppress Ray actor messages (ERROR=40, WARNING=30, INFO=20)
options.backend.init_args.log_to_driver = false  # Don't duplicate logs to driver
options.backend.client_resources.num_cpus = 2  # CPUs per client
options.backend.client_resources.num_gpus = 0.2  # GPU share per client (5 clients × 0.2 = 1.0 total GPU)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcot"
version = "1.0.0"
description = "Federated Deep Co-Training with Flower"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "FedCT Team"}
]

dependencies = [
    "flwr[simulation]>=1.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedcot"]

[tool.flwr.app]
publisher = "fedcot"

[tool.flwr.app.components]
serverapp = "fedcot.server_app:app"
clientapp = "fedcot.client_app:app"

[tool.flwr.app.config]
num-communication-rounds = 2
num-clients = 5
num-local-rounds = 2
unlabeled-size = 100
dataset = "CIFAR10"
architecture = "LightCNN"
optimizer = "Adam"
learning-rate = 0.001
private-batch-size = 64
public-batch-size = 32

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.init_args.num_cpus = 2
options.backend.init_args.logging_level = 40
options.backend.init_args.log_to_driver = false
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.2

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedavg-baseline"
version = "1.0.0"
description = "Flower FedAvg baseline for comparison with FedCT"
requires-python = ">=3.8"
dependencies = [
    "flwr[simulation]>=1.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]

[tool.flwr.app]
publisher = "fedavg-baseline"

[tool.flwr.app.components]
serverapp = "app:server_app"
clientapp = "app:client_app"

[tool.flwr.app.config]
num-communication-rounds = 2
num-clients = 5
num-local-rounds = 2
dataset = "CIFAR10"
architecture = "LightCNN"
optimizer = "Adam"
learning-rate = 0.001
batch-size = 64
unlabeled-size = 0
seed = 42

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5
options.backend.init_args.num_cpus = 2
options.backend.init_args.logging_level = 40
options.backend.init_args.log_to_driver = false
options.backend.client_resources.num_cpus = 1
options.backend.client_resources.num_gpus = 0.2
